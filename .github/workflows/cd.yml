name: CD

# Ships master to the production droplet (CLAUDE.md G.7):
#   test (full reactor, real Postgres — the same gate as CI)
#     -> build & push image to GHCR (tagged with the git SHA = rollback handle)
#       -> scp compose/Caddyfile + SSH deploy, gated on the container going healthy.
#
# Rollback = re-run the deploy with the previous SHA: edit APP_TAG in
# /opt/callme/.env and `docker compose up -d` (see deploy/README.md).
on:
  push:
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false # never kill a deploy halfway through

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x ./mvnw
      # Testcontainers provides the Postgres for integration tests — the runner has Docker.
      - name: Test (full reactor)
        run: ./mvnw -B -ntp -pl start -am test
      - name: Package bootable jar (tests already passed)
        run: ./mvnw -B -ntp -pl start -am package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: start/target/start-*.jar
          retention-days: 1

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: start/target/
      - name: Resolve image name (GHCR requires lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment: production # shows up in GitHub's deployment history; add reviewers there for manual approval if wanted
    steps:
      - uses: actions/checkout@v4
      # The repo stays authoritative for the runtime topology: every deploy
      # re-ships compose + Caddyfile, so droplet-side drift can't accumulate.
      - name: Ship compose + Caddyfile
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile,deploy/backup-db.sh"
          target: /opt/callme/
          strip_components: 1
      - name: Deploy and verify health
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          envs: SHA
          script_stop: true
          script: |
            cd /opt/callme
            chmod +x backup-db.sh
            # Pin the exact SHA in .env so manual `docker compose` runs later keep
            # using what was actually deployed, not a drifting :latest.
            if grep -q '^APP_TAG=' .env; then
              sed -i "s|^APP_TAG=.*|APP_TAG=${SHA}|" .env
            else
              echo "APP_TAG=${SHA}" >> .env
            fi
            docker compose pull app
            docker compose up -d --remove-orphans
            # Gate the pipeline on the app actually coming up healthy — a deploy
            # that "succeeded" while the container crash-loops is a lie.
            status=starting
            for i in $(seq 1 36); do
              status=$(docker inspect --format '{{.State.Health.Status}}' callme-app 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::App did not become healthy after deploy (status: $status)"
              docker logs --tail 200 callme-app || true
              exit 1
            fi
            docker image prune -f
            echo "Deployed ${SHA} — app healthy."
