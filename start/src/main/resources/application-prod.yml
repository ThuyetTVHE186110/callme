# Production sits behind a reverse proxy / load balancer. Tomcat's RemoteIpValve
# rewrites request.getRemoteAddr() from X-Forwarded-For — but ONLY when the direct
# peer matches `internal-proxies` (Boot's default regex covers the private/RFC-1918
# ranges an internal LB lives in), so an external client spoofing the header gains
# nothing. Without this, every client appears as the LB's address and the per-IP
# login/register rate limit (RateLimitFilter) becomes one shared global bucket —
# 5 logins/minute for the entire user base (OWASP A07).
server:
  # Rolling deploys (CLAUDE.md G.7): in-flight requests — a trip completion, a cash
  # confirmation — get up to the lifecycle timeout below to finish before the old
  # container is stopped, instead of being severed mid-transaction.
  shutdown: graceful
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  lifecycle:
    # Budget for the graceful drain above.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Sized for a modest single-instance Postgres (CLAUDE.md targets MVP scale,
      # not a sharded fleet — see §3 G.4 on `findAvailableNear` scaling being a
      # later concern). Tune `maximum-pool-size` against `max_connections` on the
      # DB side as more app instances are added — the classic shared-resource trap.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Logs a warning with a stack trace if a connection is held > 60s without
      # being returned — catches connection leaks (a missing close/try-with-resources
      # in some adapter) long before they exhaust the pool and take the app down.
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  # Off by default in prod — a published API surface is itself useful intel for an
  # attacker, and CLAUDE.md's actual prod consumers are mobile apps that ship with
  # the contract baked in, not browsers exploring /swagger-ui.html. Flip it on
  # deliberately (e.g. for a partner-integration phase) via env var, not by default.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  sms:
    # CLAUDE.md §4.8 — SpeedSMS is the live provider (free integration credit first;
    # ZNS-first/eSMS are documented later steps). The access token has NO default:
    # missing SPEEDSMS_ACCESS_TOKEN fails the boot loudly, same posture as JWT_SECRET
    # — going live with the `logging` fake would print real OTP codes into prod logs.
    provider: ${SMS_PROVIDER:speedsms}
    speedsms:
      access-token: ${SPEEDSMS_ACCESS_TOKEN}
      # 4 = SpeedSMS's shared "Notify" sender — works with the free credit, no
      # registered brandname needed. Once the CallMe brandname clears carrier
      # registration: SPEEDSMS_SMS_TYPE=3 + SPEEDSMS_SENDER=<brand>, no code change.
      sms-type: ${SPEEDSMS_SMS_TYPE:4}
      sender: ${SPEEDSMS_SENDER:}
  cors:
    # No default — forces an explicit, reviewed list of real origins at deploy time,
    # the same posture as JWT_SECRET/DB_* above (CLAUDE.md production posture: no
    # silent fallbacks for anything security-relevant).
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
